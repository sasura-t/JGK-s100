<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>GPS TAG 追跡画面 ④</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* s92 / GPS④ — GPS③(s89)と同じ見た目。違いは地図と「タグも現在地も移動しない」(位置と地図の場所・大きさは編集モードで調整) */
:root{
  color-scheme: light;
  --page:#1d2226;
  --panel:#ffffff; --panel2:#f3f5f6; --line:#d9dee2;
  --ink:#16202a; --dim:#5e6b77; --faint:#98a3ad;
  --me:#00a296; --me-soft:rgba(0,162,150,.16);
  --tag:#e5231b; --tag-soft:rgba(229,35,27,.16);
  --ok:#2e9e4f; --north:#e0261b;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--jp);margin:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.device{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
@media (min-width:480px){
  body{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .device{flex:none;width:414px;height:896px;border-radius:44px;transform-origin:center;box-shadow:0 0 0 10px #0d1013,0 0 0 11px #3a4148,0 30px 80px rgba(0,0,0,.5)}
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 32px;font:600 15px -apple-system,"SF Pro Text",sans-serif;z-index:6;color:#fff}
.sb .icons{display:flex;gap:6px;align-items:center}
.sb svg{display:block;fill:#fff}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:12}

.top{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--ink);color:#fff;
  box-shadow:0 6px 18px rgba(20,32,42,.12);padding:44px 12px 0}
.appbar{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.appbar .ttl{font-weight:700;font-size:15px;letter-spacing:.04em}
.appbar .logo{display:block;width:30px;height:30px;border-radius:7px;box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.25)}
.appbar .logo svg{display:block;border-radius:7px}
.appbar .mode{margin-left:auto;font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--ink);background:#fff;padding:3px 7px;border-radius:3px}

.fabs{position:absolute;right:12px;bottom:110px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:12px}
#compass{width:62px;height:62px;filter:drop-shadow(0 2px 5px rgba(20,32,42,.25))}
#compass svg{width:100%;height:100%;display:block}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 8px rgba(20,32,42,.28);transition:background .2s,transform .1s}
.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.fab svg{display:block}
#b-locate.on{background:var(--me)}
#b-locate.on path,#b-locate.on circle{stroke:#fff}
#b-locate.on .dot{fill:#fff}
#b-refresh.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fabs.left{right:auto;left:12px}

.toast{position:absolute;left:50%;z-index:9;transform:translate(-50%,-6px);opacity:0;transition:opacity .25s,transform .25s;
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px;white-space:nowrap;
  display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:#4cd577}

#picker{position:absolute;inset:0;z-index:30;background:var(--ink);display:grid;place-items:center;padding:24px;color:#fff}
.pk{display:grid;justify-items:center;gap:12px;text-align:center;max-width:300px}
.pk b{font-size:18px}
.pk p{margin:0;font-size:13px;line-height:1.6;color:#b7c1ca}
.pkbtn{margin-top:6px;background:var(--me);color:#fff;font-weight:700;font-size:15px;padding:12px 26px;border-radius:10px;cursor:pointer}
.pkbtn:focus-within,.pkbtn:hover{filter:brightness(1.08)}
.pknote{color:#ffb4ae!important}

#menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(13,18,24,.42);opacity:0;pointer-events:none;transition:opacity .25s}
#menu.open{opacity:1;pointer-events:auto}
.msheet{background:#fff;border-radius:16px 16px 0 0;padding:10px 0 calc(30px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .25s}
#menu.open .msheet{transform:none}
.mhead{display:flex;align-items:center;padding:6px 18px 10px}
.mhead b{font-size:17px}
.mclose{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center;cursor:pointer}
.mdev{display:flex;align-items:center;gap:12px;margin:0 16px 8px;padding:12px;border-radius:8px;background:var(--panel2)}
.mdev .ic{width:36px;height:36px;border-radius:8px;background:var(--tag);display:grid;place-items:center}
.mdev .n{font:600 15px var(--mono)}
.mdev .s{font-size:12px;color:var(--ok);font-weight:700}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);font-size:15px;font-weight:500}
.mlist li svg{flex:none}
.mlist li .chev{margin-left:auto;color:var(--faint)}
.mlist li.tap{cursor:pointer}

#ui{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:#fff;
  padding:12px 16px calc(26px + env(safe-area-inset-bottom,0px))}
#ui-main{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dev{width:40px;height:40px;border-radius:8px;background:var(--tag);display:grid;place-items:center}
.dname{font:600 15px var(--mono);letter-spacing:.06em}
.dsub{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#9fe3b4}
.dsub i{width:8px;height:8px;border-radius:50%;background:#4cd577;animation:bl 1.6s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}

/* 隠し操作パネル: 地図を長押し */
#ctrl{margin-top:12px;border-top:1px solid #33404b;padding-top:12px}
#ctrl-btns{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.cbtn{background:#2b3640;border:0;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
#cbtn-play{background:var(--me);width:48px;height:48px}
.cbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.clabel{color:#9aa6b1;font-size:11px;white-space:nowrap;width:28px}
.cval{color:#7ee0d6;font:600 12px var(--mono);min-width:44px;text-align:right}
input[type=range]{flex:1;min-width:0;accent-color:var(--me)}
.hint{font-size:10.5px;color:#6f7d89;text-align:center;margin-top:6px}
.seg{flex:1;display:flex;gap:6px}
.seg button{flex:1;height:30px;border:0;border-radius:6px;background:#2b3640;color:#9aa6b1;font:700 12px var(--jp);cursor:pointer}
.seg button.on{background:var(--me);color:#fff}
#editseg button[data-ed="tag"].on{background:var(--tag)}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.seg.tools button{color:#dfe5ea}
.vinfo{flex:1;font-size:11.5px;font-weight:700;color:var(--acc,#00a296);white-space:nowrap}
.jpname{font-family:var(--jp)!important;letter-spacing:.08em}

@media (max-width:479px){
  .sb,.homebar{display:none}
  .top{padding-top:max(8px,env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){.dsub i{animation:none}}
</style>
</head>
<body>
<div class="device" id="wrap">
  <canvas id="cv"></canvas>

  <div class="sb">
    <span id="clock">14:52</span>
    <span class="icons" aria-hidden="true">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="15" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="top" id="top">
    <div class="appbar">
      <span class="logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 60 60">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd0bf"/><stop offset="1" stop-color="#00877c"/></linearGradient></defs>
          <rect width="60" height="60" rx="14" fill="url(#lg)"/>
          <circle cx="30" cy="27" r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <path d="M30 12c-7.2 0-13 5.6-13 12.6C17 34 30 47 30 47s13-13 13-22.4C43 17.6 37.2 12 30 12z" fill="#fff"/>
          <circle cx="30" cy="25" r="6.2" fill="#e5231b"/>
          <circle cx="30" cy="25" r="2.4" fill="#fff"/>
        </svg>
      </span>
      <span class="ttl">見守りタグを探す</span>
      <span class="mode">TRACKING</span>
    </div>
  </div>

  <div class="fabs" id="fabs">
    <div id="compass" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="56" fill="#fff" stroke="#d9dee2" stroke-width="2"/>
        <g id="dial"></g>
        <g id="needle">
          <polygon points="60,14 51,60 69,60" fill="#e0261b"/>
          <polygon points="60,106 51,60 69,60" fill="#16202a"/>
          <text x="60" y="11" font-size="15" font-weight="800" font-family="-apple-system,sans-serif" text-anchor="middle" fill="#e0261b" id="ntext">N</text>
        </g>
        <circle cx="60" cy="60" r="6" fill="#fff" stroke="#16202a" stroke-width="2"/>
      </svg>
    </div>
    <button class="fab" id="b-locate" type="button" aria-label="現在地を表示" aria-pressed="false">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00a296" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5"/><circle class="dot" cx="12" cy="12" r="2.6" fill="#00a296" stroke="none"/></svg>
    </button>
    <button class="fab" id="b-menu" type="button" aria-label="メニュー">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div id="picker">
    <div class="pk">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00a296" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      <b>地図画像を読み込む</b>
      <p>s92で使う地図の画像ファイルを選んでください。元の画質のまま表示します。</p>
      <label class="pkbtn" for="mapfile">画像を選択</label>
      <input type="file" id="mapfile" accept="image/*" hidden>
      <p class="pknote" id="pkerr" hidden></p>
    </div>
  </div>
  <div class="toast" id="toast" role="status"><i></i><span id="toast-msg">最新の位置情報を取得しました</span></div>

  <div class="fabs left" id="fabsL">
    <button class="fab" id="b-refresh" type="button" aria-label="最新の情報を取得">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.1"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>

  <div id="menu" aria-hidden="true">
    <div class="msheet" role="dialog" aria-label="メニュー">
      <div class="mhead"><b>メニュー</b>
        <button class="mclose" id="m-close" type="button" aria-label="閉じる"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
      <div class="mdev">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff"/><circle cx="12" cy="12" r="3.5" fill="#e5231b"/></svg></div>
        <div><div class="n" id="m-name">TAG-01</div><div class="s">受信中</div></div>
      </div>
      <ul class="mlist">
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>移動履歴<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2.5" fill="#16202a"/></svg>エリア通知の設定<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>通知<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M11 18h2"/></svg>登録端末の管理<span class="chev">›</span></li>
        <li class="tap" id="m-map" role="button" tabindex="0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>地図画像を変更<span class="chev">›</span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16202a" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>アプリについて<span class="chev">›</span></li>
      </ul>
    </div>
  </div>

  <div id="ui">
    <div id="ui-main">
      <div class="dev"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#fff"/><circle cx="12" cy="12" r="3.5" fill="#e5231b"/></svg></div>
      <div class="dname" id="ui-name">TAG-01</div>
      <div class="dsub"><i></i><span>受信中</span></div>
    </div>
    <div id="ctrl" hidden>
      <div id="ctrl-btns" hidden>
        <button class="cbtn" id="b-back" type="button" aria-label="10%戻る"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M11 19 2 12l9-7v14zM22 19l-9-7 9-7v14z" fill="#fff"/></svg></button>
        <button class="cbtn" id="cbtn-play" type="button" aria-label="再生"><svg id="ip" width="22" height="22" viewBox="0 0 24 24"><path d="M6 4l12 8-12 8V4z" fill="#fff"/></svg><svg id="ipu" width="22" height="22" viewBox="0 0 24 24" hidden><rect x="5" y="4" width="4" height="16" fill="#fff"/><rect x="15" y="4" width="4" height="16" fill="#fff"/></svg></button>
        <button class="cbtn" id="b-fwd" type="button" aria-label="10%進む"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M13 5l9 7-9 7V5zM2 5l9 7-9 7V5z" fill="#fff"/></svg></button>
        <button class="cbtn" id="b-reset" type="button" aria-label="最初に戻す"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12A9 9 0 1 0 5.64 5.64" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M3 7v5h5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="crow" hidden><span class="clabel">進行</span><input type="range" id="si" min="0" max="1000" value="0"><span class="cval" id="sv">0%</span></div>
      <div class="crow" hidden><span class="clabel">速度</span><input type="range" id="sp" min="0.25" max="2" value="1" step="0.25"><span class="cval" id="spv">x1.0</span></div>
      <div class="crow"><span class="clabel">表記</span><div class="seg" id="nameseg"><button type="button" data-name="TAG-01" class="on">TAG-01</button><button type="button" data-name="こころ">こころ</button></div></div>
      <div class="crow"><span class="clabel">北</span><input type="range" id="nd" min="0" max="359" step="1" value="270"><span class="cval" id="ndv">270°</span></div>
      <div class="crow"><span class="clabel">編集</span><div class="seg" id="editseg"><button type="button" data-ed="" class="on">オフ</button><button type="button" data-ed="map">地図</button><button type="button" data-ed="me">自分の位置</button><button type="button" data-ed="tag">タグの位置</button></div></div>
      <div class="crow" id="viewrow" hidden><span class="clabel"></span><span class="vinfo" id="viewinfo"></span><div class="seg tools" style="flex:none;width:96px"><button type="button" id="vw-reset">初期表示</button></div></div>
      <div class="crow" id="edrow" hidden><span class="clabel"></span><div class="seg tools"><button type="button" id="ed-undo" hidden>1点戻す</button><button type="button" id="ed-clear">消去</button><button type="button" id="ed-copy">コピー</button></div></div>
      <div class="hint" id="hint">地図を長押しでこのパネルを閉じる</div>
    </div>
  </div>
  <div class="homebar"></div>
</div>

<script>
(()=>{
/* ===================== 設定 =====================
   ルートは地図画像に対する割合(0〜1)で保存。画面上で打ち直すとこのブラウザに記憶される。
   地図は埋め込まず、起動時の選択画面でs92の地図画像を選ぶ。ルートは画面上で打つ(初期値は空)。
   進行0%→100%で、自分とタグがそれぞれのルートを出発点から終点まで同時に移動する。 */
let TAG_LABEL='TAG-01';
const DURATION=90000; // x1.0で全行程90秒
const MAP_ZOOM=1.35; // 見え方を調整していないときの地図の拡大率(1=画面を埋める大きさ)
const ZMIN=1,ZMAX=6; // ピンチで変えられる拡大率の範囲(1より小さくすると地図の外が見えるので1まで)
const DEF={
  me:[[0.6171,0.5038]], // 自分(現在地): 画面中央の山あいにある点線の道の先端。移動しない
  tag:[[0.6692,0.434]], // タグ: 現在地から画面の真上方向へ少し進んだ山の中。移動しない
  north:270, // 北は方位磁針の西側(左)を指す
  view:null  // 地図の見え方 {z:拡大率,c:[中心u,中心v]}。null=自分とタグの中間を中心に自動。編集モードのピンチ/ドラッグで変わる
};
const DEFAULT_MAP=''; // 埋め込みなし: 起動時に地図を選ぶ画面を出す
/* ================================================ */

const $=id=>document.getElementById(id)||{style:{},classList:{add(){},remove(){},toggle(){}},setAttribute(){}};
const wrap=$('wrap'),cv=$('cv'),ctx=cv.getContext('2d');
const cfg={me:DEF.me.slice(),tag:DEF.tag.slice(),north:DEF.north,view:DEF.view};
let img=new Image(),IW=922,IH=1719;

/* 保存(このブラウザ内)。①・③とは別の保存先 */
const DB={open(){return new Promise((ok,ng)=>{try{const r=indexedDB.open('gps-mock-s92',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}catch(e){ng(e)}})},
  async get(k){const d=await this.open();return new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})},
  async set(k,v){const d=await this.open();return new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}};
const saveCfg=()=>DB.set('cfg92',{me:cfg.me,tag:cfg.tag,north:cfg.north,view:cfg.view,v:5}).catch(()=>{});

let mapURL=null;
function showMap(blob,save){
  const url=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{if(mapURL)URL.revokeObjectURL(mapURL);mapURL=url;img=im;IW=im.naturalWidth;IH=im.naturalHeight;
    document.getElementById('picker').hidden=true;rebuild();frame();if(save)DB.set('map92',blob).catch(()=>{})};
  im.onerror=()=>{URL.revokeObjectURL(url);const e=document.getElementById('pkerr');e.textContent='この画像は開けませんでした。PNGかJPEGの画像を選んでください。';e.hidden=false};
  im.src=url;
}
document.getElementById('mapfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)showMap(f,true);e.target.value=''});
if(DEFAULT_MAP){document.getElementById('picker').hidden=true;
  const d=new Image();d.onload=()=>{if(!mapURL){img=d;IW=d.naturalWidth;IH=d.naturalHeight;rebuild();frame()}};d.src=DEFAULT_MAP}
// 地図が埋め込まれていないときは、前に選んだ地図があればそれを使い、なければ選択画面を出したままにする
DB.get('map92').then(b=>{if(b)showMap(b,false)}).catch(()=>{});
DB.get('cfg92').then(c=>{if(c&&Array.isArray(c.me)&&Array.isArray(c.tag)){const ok=c.v===5;cfg.me=ok&&c.me.length?c.me:DEF.me.slice();cfg.tag=ok&&c.tag.length?c.tag:DEF.tag.slice();if(c.v>=2&&typeof c.north==='number')cfg.north=c.north;cfg.view=ok&&c.view&&typeof c.view.z==='number'&&Array.isArray(c.view.c)?c.view:DEF.view;rebuild();frame();sync()}}).catch(()=>{});

let progress=0,speed=1,playing=false,last=null,seeking=false,editing='';

/* ルート: 距離に沿って等速で進む */
const px=a=>a.map(([u,v])=>[u*IW,v*IH]);
function sampler(pts){
  const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1]||0;
  return f=>{
    if(!pts.length)return null;
    if(pts.length===1||!tot)return{p:pts[0],a:null};
    const d=Math.max(0,Math.min(1,f))*tot;let i=1;while(i<L.length-1&&L[i]<d)i++;
    const a=pts[i-1],b=pts[i],t=(d-L[i-1])/((L[i]-L[i-1])||1);
    return{p:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],a:Math.atan2(b[1]-a[1],b[0]-a[0])};
  };
}
let meS=sampler([]),tagS=sampler([]);
function rebuild(){meS=sampler(px(cfg.me));tagS=sampler(px(cfg.tag))}

/* 方位磁針の目盛り */
(()=>{let h='';for(let i=0;i<72;i++){const a=i*5*Math.PI/180,l=i%18===0?10:i%2===0?6:3,r1=52,r2=r1-l;
  h+=`<line x1="${60+Math.sin(a)*r1}" y1="${60-Math.cos(a)*r1}" x2="${60+Math.sin(a)*r2}" y2="${60-Math.cos(a)*r2}" stroke="#16202a" stroke-opacity="${i%18===0?.8:.35}" stroke-width="${i%18===0?2:1}"/>`}
  $('dial').innerHTML=h})();

/* 画面サイズと地図の配置
   撮影時も編集時も同じ見え方。地図の中心(C)が画面の基準点(A)に来るように置く */
let vw=0,vh=0,dpr=1,S=1,OX=0,OY=0,topH0=0,uiH0=0;
const cover=()=>Math.max(vw/IW,vh/IH);
// 下の情報パネルの高さ(操作パネルを除く)。操作パネルを開いても地図の見え方が変わらないように
function uiBase(){const u=document.getElementById('ui'),c=document.getElementById('ctrl');
  return u.offsetHeight-(c.hidden?0:c.offsetHeight+parseFloat(getComputedStyle(c).marginTop||0))}
const anchorY=()=>(topH0+70+vh-uiBase()-60)/2;
function autoView(){
  const p=[...px(cfg.me),...px(cfg.tag)];let cx=IW/2,cy=IH/2;
  if(p.length){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of p){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}cx=(x0+x1)/2;cy=(y0+y1)/2}
  return{z:MAP_ZOOM,c:[cx/IW,cy/IH]};
}
const curView=()=>cfg.view||autoView();
function frame(){
  if(!vw||!vh)return;const v=curView();
  S=cover()*v.z;OX=vw/2-v.c[0]*IW*S;OY=anchorY()-v.c[1]*IH*S;
  // 地図の端が画面に入らないように寄せる
  OX=Math.min(0,Math.max(vw-IW*S,OX));OY=Math.min(0,Math.max(vh-IH*S,OY));
  if(editing){const z=v.z;$('viewinfo').textContent=`地図の大きさ x${z.toFixed(2)}`}
}
// 今の配置(OX,OY,S)を見え方として記憶する
function storeView(z){cfg.view={z:+z.toFixed(3),c:[+((vw/2-OX)/S/IW).toFixed(4),+((anchorY()-OY)/S/IH).toFixed(4)]}}
// 画面上の点(PX,PY)の下にある地図の位置を動かさずに拡大率を z にする
function zoomAt(z,PX,PY){z=Math.min(ZMAX,Math.max(ZMIN,z));const ix=(PX-OX)/S,iy=(PY-OY)/S;
  S=cover()*z;OX=PX-ix*S;OY=PY-iy*S;OX=Math.min(0,Math.max(vw-IW*S,OX));OY=Math.min(0,Math.max(vh-IH*S,OY));storeView(z);frame()}
function panBy(dX,dY){const z=curView().z;OX+=dX;OY+=dY;OX=Math.min(0,Math.max(vw-IW*S,OX));OY=Math.min(0,Math.max(vh-IH*S,OY));storeView(z);frame()}
function placeFabs(){$('fabs').style.bottom=$('fabsL').style.bottom=(document.getElementById('ui').offsetHeight+14)+'px'}
function resize(){
  wrap.style.transform='';
  if(innerWidth>=480){const k=Math.min(1,(innerHeight-60)/896,(innerWidth-60)/414);wrap.style.transform=k<1?`scale(${k})`:''}
  vw=wrap.clientWidth;vh=wrap.clientHeight;dpr=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  topH0=document.getElementById('top').offsetHeight;uiH0=document.getElementById('ui').offsetHeight;
  frame();placeFabs();
}

/* 現在地ボタン用カメラ: t=0 全体 / t=1 自分を中心に拡大 */
const ZOOM=1.9;const cam={t:0,goal:0,fx:0,fy:0,cx:0,cy:0};
const camApply=(X,Y)=>{const t=cam.t,z=1+(ZOOM-1)*t;return[cam.fx+(X-cam.fx)*z+(cam.cx-cam.fx)*t,cam.fy+(Y-cam.fy)*z+(cam.cy-cam.fy)*t]};
const sc=(x,y)=>camApply(OX+x*S,OY+y*S);
function unsc(X,Y){const t=cam.t,z=1+(ZOOM-1)*t;
  const a=cam.fx+(X-cam.fx-(cam.cx-cam.fx)*t)/z,b=cam.fy+(Y-cam.fy-(cam.cy-cam.fy)*t)/z;return[(a-OX)/S,(b-OY)/S]}
const fmtSp=v=>'x'+(+v<1?(+v).toFixed(2):(+v).toFixed(1));

/* 描画 */
let tagFlash=0;
function drawTag(ts,pos){
  const[x,y]=sc(...pos);
  if(tagFlash){const e=(performance.now()-tagFlash)/900;if(e<1){ctx.beginPath();ctx.arc(x,y,12+e*70,0,7);ctx.strokeStyle=`rgba(229,35,27,${1-e})`;ctx.lineWidth=4*(1-e)+1;ctx.stroke()}}
  for(let k=0;k<3;k++){const p=((ts/2200)+k/3)%1;ctx.beginPath();ctx.arc(x,y,10+p*46,0,7);
    ctx.strokeStyle=`rgba(229,35,27,${(1-p)*.7})`;ctx.lineWidth=2;ctx.stroke()}
  ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.fillStyle='rgba(229,35,27,.14)';ctx.fill();
  ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fillStyle='#fff';ctx.shadowBlur=6;ctx.shadowColor='rgba(0,0,0,.3)';ctx.fill();ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fillStyle='#e5231b';ctx.fill();
  ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.font=/^[\x00-\x7f]*$/.test(TAG_LABEL)?'600 11px "IBM Plex Mono",ui-monospace,monospace':'700 12px "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  const tw=ctx.measureText(TAG_LABEL).width,flip=x+20+tw+12>vw-6,lx=flip?x-20-tw-12:x+20,ly=y-20,ex=flip?lx+tw+12:lx;
  ctx.fillStyle='#e5231b';ctx.fillRect(lx,ly-9,tw+12,18);
  // 画面右端に近いときはラベルを左側に出す
  ctx.beginPath();ctx.moveTo(ex,ly+9);ctx.lineTo(flip?ex+6:ex-6,ly+15);ctx.lineTo(flip?ex-6:ex+6,ly+9);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(TAG_LABEL,lx+6,ly+.5);
}
function drawMe(me,hd,ts){
  const[x,y]=sc(...me);
  const k=.5-.5*Math.cos(ts/2600*Math.PI*2);
  ctx.beginPath();ctx.arc(x,y,14+12*k,0,7);ctx.fillStyle=`rgba(0,162,150,${.06+.16*k})`;ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(hd);
  ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(11,12);ctx.lineTo(0,6);ctx.lineTo(-11,12);ctx.closePath();
  ctx.fillStyle='#00a296';ctx.shadowBlur=6;ctx.shadowColor='rgba(0,0,0,.35)';ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();ctx.restore();
}
/* 編集中だけ見えるルート線(撮影時は表示されない) */
function drawEdit(){
  for(const[k,col,lab]of[['me','#00a296','自分'],['tag','#e5231b','タグ']]){
    const p=px(cfg[k]).map(q=>sc(...q));if(!p.length)continue;
    ctx.globalAlpha=editing===k?1:.4;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));
    ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();
    p.forEach((q,i)=>{const end=i===0||i===p.length-1;ctx.beginPath();ctx.arc(q[0],q[1],end?6:3.5,0,7);ctx.fillStyle=i===0?'#fff':col;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke()});
    ctx.font='700 11px "Zen Kaku Gothic New","Hiragino Sans",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.strokeText(lab,p[0][0]+10,p[0][1]);ctx.fillStyle=col;ctx.fillText(lab,p[0][0]+10,p[0][1]);
    ctx.globalAlpha=1;
  }
}
let heading=null,clockT=0;
/* 自分とタグの中間が画面中央に来るように地図をなめらかに動かす */
const follow={snap:true};
function followCam(m,g){
  const top=topH0,bot=vh-uiH0,cx=(m[0]+g[0])/2,cy=(m[1]+g[1])/2;
  let tx=vw/2-cx*S,ty=(top+70+bot-60)/2-cy*S;
  tx=Math.min(0,Math.max(vw-IW*S,tx));ty=Math.min(0,Math.max(vh-IH*S,ty));
  if(follow.snap){OX=tx;OY=ty;follow.snap=false}else{OX+=(tx-OX)*.06;OY+=(ty-OY)*.06}
}
function draw(ts){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,vw,vh);
  const m=meS(progress),g=tagS(progress);
  if(m){cam.fx=OX+m.p[0]*S;cam.fy=OY+m.p[1]*S}
  cam.cx=vw/2;cam.cy=topH0+(vh-topH0-uiBase())/2;
  cam.t+=(cam.goal-cam.t)*.08;if(Math.abs(cam.goal-cam.t)<.001)cam.t=cam.goal;
  if(img.complete&&img.naturalWidth){ctx.imageSmoothingQuality='high';const[ix,iy]=sc(0,0),zz=1+(ZOOM-1)*cam.t;ctx.drawImage(img,ix,iy,IW*S*zz,IH*S*zz)}
  if(editing)drawEdit();
  if(m){
    // 矢印は進行方向を向く(曲がり角はなめらかに回る)
    if(m.a!=null){const tg=m.a+Math.PI/2;if(heading==null)heading=tg;else{const d=Math.atan2(Math.sin(tg-heading),Math.cos(tg-heading));heading+=d*.15}}
    drawMe(m.p,heading||0,ts);
  }
  if(g)drawTag(ts,g.p);
  if(ts-clockT>1000){clockT=ts;const n=new Date();$('clock').textContent=`${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`}
}

/* ループ */
function loop(ts){
  if(last==null)last=ts;const dt=ts-last;last=ts;
  if(playing&&!seeking&&progress<1){progress=Math.min(1,progress+dt*speed/DURATION);if(progress>=1)setPlaying(false)}
  if(!seeking){$('si').value=Math.round(progress*1000);$('sv').textContent=Math.round(progress*100)+'%'}
  draw(ts);requestAnimationFrame(loop);
}

/* 操作 */
function setPlaying(v){playing=v;last=null;$('ip').hidden=v;$('ipu').hidden=!v;$('cbtn-play').setAttribute('aria-label',v?'一時停止':'再生')}
function sync(){$('si').value=Math.round(progress*1000);$('sv').textContent=Math.round(progress*100)+'%';$('sp').value=speed;$('spv').textContent=fmtSp(speed);
  $('nd').value=Math.round(cfg.north);$('ndv').textContent=Math.round(cfg.north)+'°';
  $('needle').setAttribute('transform',`rotate(${cfg.north} 60 60)`);$('ntext').setAttribute('transform',`rotate(${-cfg.north} 60 7)`)}
const resetHeading=()=>{heading=null};
$('cbtn-play').onclick=()=>{if(progress>=1){progress=0;resetHeading()}setPlaying(!playing)};
$('b-back').onclick=()=>{progress=Math.max(0,progress-.1);resetHeading();sync()};
$('b-fwd').onclick=()=>{progress=Math.min(1,progress+.1);resetHeading();sync()};
$('b-reset').onclick=()=>{progress=0;resetHeading();setPlaying(false);sync()};
const si=$('si');si.oninput=()=>{progress=si.value/1000;resetHeading();$('sv').textContent=Math.round(progress*100)+'%'};
si.onpointerdown=()=>seeking=true;addEventListener('pointerup',()=>seeking=false);
$('sp').oninput=e=>{speed=+e.target.value;$('spv').textContent=fmtSp(speed)};
$('nd').oninput=e=>{cfg.north=+e.target.value;sync();saveCfg()};

let toastTimer=null;
function toast(msg){const t=$('toast');$('toast-msg').textContent=msg;t.style.top=(topH0+12)+'px';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
let refreshing=false;
$('b-refresh').onclick=()=>{if(refreshing)return;refreshing=true;const b=$('b-refresh');b.classList.add('spin');
  setTimeout(()=>{b.classList.remove('spin');refreshing=false;tagFlash=performance.now();toast('最新の位置情報を取得しました')},1100)};
$('b-locate').onclick=()=>{if(editing)return;cam.goal=cam.goal?0:1;$('b-locate').classList.toggle('on',!!cam.goal);$('b-locate').setAttribute('aria-pressed',cam.goal?'true':'false')};

/* 表記切り替え */
document.querySelectorAll('#nameseg button').forEach(btn=>btn.onclick=()=>{
  TAG_LABEL=btn.dataset.name;const jp=!/^[\x00-\x7f]*$/.test(TAG_LABEL);
  document.querySelectorAll('#nameseg button').forEach(x=>x.classList.toggle('on',x===btn));
  for(const id of['ui-name','m-name']){const e=document.getElementById(id);e.textContent=TAG_LABEL;e.classList.toggle('jpname',jp)}});

/* ルート編集 */
function setEdit(k){
  editing=k;
  document.querySelectorAll('#editseg button').forEach(b=>b.classList.toggle('on',b.dataset.ed===k));
  $('edrow').hidden=!k;$('viewrow').hidden=!k;$('ed-clear').hidden=!(k==='me'||k==='tag');
  $('hint').textContent=k==='map'?'ドラッグで地図を動かす・2本指で拡大縮小(PCはホイール)'
    :k?`タップで${k==='me'?'自分(現在地)':'タグ'}を置く・ドラッグで移動・2本指で拡大縮小`:'地図を長押しでこのパネルを閉じる';
  if(k){cam.goal=0;cam.t=0;$('b-locate').classList.remove('on');$('b-locate').setAttribute('aria-pressed','false')}
  uiH0=document.getElementById('ui').offsetHeight;frame();
}
$('vw-reset').onclick=()=>{cfg.view=null;frame();saveCfg();toast('地図の見え方を初期状態に戻しました')};
document.querySelectorAll('#editseg button').forEach(b=>b.onclick=()=>setEdit(b.dataset.ed));
$('ed-undo').onclick=()=>{if(!editing)return;cfg[editing].pop();rebuild();saveCfg()};
$('ed-clear').onclick=()=>{if(!(editing==='me'||editing==='tag')||!cfg[editing].length)return;if(confirm(`${editing==='me'?'自分':'タグ'}の位置を消しますか？`)){cfg[editing]=[];rebuild();saveCfg()}};
$('ed-copy').onclick=()=>{const s=JSON.stringify({me:cfg.me,tag:cfg.tag,north:cfg.north,view:cfg.view});
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('位置をコピーしました'),()=>toast('コピーできませんでした'))};
function addPoint(e){
  const r=wrap.getBoundingClientRect(),X=(e.clientX-r.left)*vw/r.width,Y=(e.clientY-r.top)*vh/r.height;
  const[x,y]=unsc(X,Y);if(x<0||y<0||x>IW||y>IH)return;
  cfg[editing]=[[+(x/IW).toFixed(4),+(y/IH).toFixed(4)]];rebuild();if(!cfg.view)frame();saveCfg(); // ④は移動しないので常に1点
}

/* メニュー */
const menu=$('menu');
const closeMenu=()=>{menu.classList.remove('open');menu.setAttribute('aria-hidden','true')};
$('m-map').onclick=()=>{closeMenu();document.getElementById('mapfile').click()};
$('m-map').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('m-map').click()}};
$('b-menu').onclick=()=>{menu.classList.add('open');menu.setAttribute('aria-hidden','false')};
$('m-close').onclick=closeMenu;menu.addEventListener('click',e=>{if(e.target===menu)closeMenu()});

new ResizeObserver(()=>{uiH0=document.getElementById('ui').offsetHeight;placeFabs();frame()}).observe(document.getElementById('ui'));

/* 地図の操作
   長押し=操作パネル開閉 / 編集中: タップ=位置を置く・ドラッグ=地図を動かす・2本指=拡大縮小 */
function toLocal(e){const r=wrap.getBoundingClientRect();return[(e.clientX-r.left)*vw/r.width,(e.clientY-r.top)*vh/r.height]}
const pts=new Map();let lp=null,lpFired=false,down=null,drag=null,pinch=null;
const canEdit=()=>!!editing&&!$('ctrl').hidden;
function togglePanel(){const c=$('ctrl');c.hidden=!c.hidden;if(c.hidden&&editing)setEdit('');frame()}
function pinchState(){const[a,b]=[...pts.values()];return{d:Math.hypot(b[0]-a[0],b[1]-a[1])||1,mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2}}
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('#ui,.fabs,#menu,.toast,#picker'))return;
  pts.set(e.pointerId,toLocal(e));try{wrap.setPointerCapture(e.pointerId)}catch(_){}
  if(pts.size===1){down={x:e.clientX,y:e.clientY};lpFired=false;clearTimeout(lp);lp=setTimeout(()=>{lpFired=true;togglePanel()},600)}
  else{clearTimeout(lp);down=null;drag=null;if(canEdit()&&pts.size===2)pinch=pinchState()}});
wrap.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId),cur=toLocal(e);pts.set(e.pointerId,cur);
  if(pinch&&pts.size>=2){const n=pinchState();panBy(n.mx-pinch.mx,n.my-pinch.my);zoomAt(curView().z*n.d/pinch.d,n.mx,n.my);pinch=n;return}
  if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8){clearTimeout(lp);down=null;if(canEdit()&&!cam.t)drag=true}
  if(drag)panBy(cur[0]-prev[0],cur[1]-prev[1]);
});
function endPointer(e,cancel){
  if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);clearTimeout(lp);
  if(!cancel&&down&&!lpFired&&(editing==='me'||editing==='tag')&&!$('ctrl').hidden&&pts.size===0)addPoint(e);
  if(pinch||drag)saveCfg();
  if(pts.size<2)pinch=null;if(pts.size===0){drag=null;down=null}
}
wrap.addEventListener('pointerup',e=>endPointer(e,false));
wrap.addEventListener('pointercancel',e=>endPointer(e,true));
wrap.addEventListener('wheel',e=>{if(!canEdit())return;e.preventDefault();const[X,Y]=toLocal(e);
  zoomAt(curView().z*Math.exp(-e.deltaY*.0015),X,Y);clearTimeout(wrap._wt);wrap._wt=setTimeout(saveCfg,300)},{passive:false});
wrap.addEventListener('contextmenu',e=>e.preventDefault());


addEventListener('resize',resize);
(document.fonts?document.fonts.ready:Promise.resolve()).then(resize);
rebuild();resize();sync();requestAnimationFrame(loop);
})();
</script>
